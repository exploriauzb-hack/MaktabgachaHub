<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#1e40af;--accent2:#3b82f6;--accent-soft:#eff6ff;
  --text:#111827;--muted:#6b7280;--border:#e5e7eb;--surface:#fff;
  --ok:#15803d;--ok-soft:#dcfce7;--err:#b91c1c;--err-soft:#fee2e2;
}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden;background:#e8f0fe}
body::before{content:'';position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,#dbeafe 0%,#ede9fe 40%,#fce7f3 80%,#d1fae5 100%)}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none}

.auth-wrap{position:relative;z-index:2;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:16px}

.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;box-shadow:0 8px 40px rgba(30,64,175,.1)}

.auth-logo{width:52px;height:52px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px}
.auth-title{font-size:20px;font-weight:700;color:var(--text);text-align:center;margin-bottom:4px}
.auth-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px;line-height:1.5}

/* INPUTS */
.inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);background:#fafafa;outline:none;margin-bottom:10px;display:block;transition:border .2s,background .2s}
.inp:focus{border-color:var(--accent2);background:var(--surface)}
.inp::placeholder{color:#9ca3af}

/* BUTTON */
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:2px}
.btn-primary:hover{opacity:.92}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

.btn-secondary{width:100%;padding:11px;background:transparent;color:var(--muted);border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:10px;transition:background .2s}
.btn-secondary:hover{background:#f9fafb}

/* WELCOME BACK CARD */
.welcome-card{display:none;text-align:center}
.welcome-name{font-size:18px;font-weight:700;color:var(--text);margin:10px 0 20px}

/* MESSAGES */
.msg{font-size:12px;padding:10px 13px;border-radius:8px;margin-bottom:12px;display:none;text-align:left;line-height:1.5}
.msg-err{background:var(--err-soft);color:#7f1d1d;border-left:3px solid var(--err)}
.msg-ok {background:var(--ok-soft);color:#14532d;border-left:3px solid var(--ok)}

/* FOOTER */
.auth-footer{position:relative;z-index:2;font-size:11px;color:var(--muted);text-align:center}

@media(max-width:480px){
  .auth-box{padding:28px 20px;border-radius:16px}
  .auth-title{font-size:18px}
}

<div class="auth-wrap">

    <div class="auth-logo">🎓</div>

<!-- Animated background -->
<script>
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let W,H;
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  const types=['star','heart','circle','abc','flower'];
  const colors=['#93c5fd','#c4b5fd','#fdba74','#86efac','#f9a8d4','#67e8f9','#fde68a'];
  function rnd(a,b){return a+Math.random()*(b-a)}
  const shapes=[];
  for(let i=0;i<22;i++){shapes.push({t:types[Math.floor(Math.random()*types.length)],color:colors[Math.floor(Math.random()*colors.length)],size:rnd(12,28),x:rnd(0,1)*window.innerWidth,y:rnd(0,1)*window.innerHeight,vx:rnd(-0.3,0.3),vy:rnd(-0.4,-0.1),rot:rnd(0,Math.PI*2),vrot:rnd(-0.008,0.008),op:rnd(0.15,0.4)})}
  function drawStar(ctx,cx,cy,r,col,op){ctx.save();ctx.globalAlpha=op;ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<5;i++){const a=Math.PI/2+i*Math.PI*2/5,ia=a+Math.PI/5;i===0?ctx.moveTo(cx+r*Math.cos(a),cy-r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy-r*Math.sin(a));ctx.lineTo(cx+(r*.45)*Math.cos(ia),cy-(r*.45)*Math.sin(ia))}ctx.closePath();ctx.fill();ctx.restore()}
  function drawHeart(ctx,cx,cy,r,col,op){ctx.save();ctx.globalAlpha=op;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(cx,cy+r*.5);ctx.bezierCurveTo(cx-r,cy-r*.3,cx-r*1.3,cy+r*.4,cx,cy+r*1.2);ctx.bezierCurveTo(cx+r*1.3,cy+r*.4,cx+r,cy-r*.3,cx,cy+r*.5);ctx.closePath();ctx.fill();ctx.restore()}
  function drawFlower(ctx,cx,cy,r,col,op){ctx.save();ctx.globalAlpha=op;ctx.fillStyle=col;for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.ellipse(cx+r*.6*Math.cos(a),cy+r*.6*Math.sin(a),r*.5,r*.25,a,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(cx,cy,r*.35,0,Math.PI*2);ctx.fill();ctx.restore()}
  function drawABC(ctx,cx,cy,r,col,op){ctx.save();ctx.globalAlpha=op;ctx.fillStyle=col;ctx.font=`bold ${r*1.2}px Inter,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const l=['A','B','C','1','2','3'];ctx.fillText(l[Math.floor(Math.abs(cx+cy))%l.length],cx,cy);ctx.restore()}
  function frame(){
    ctx.clearRect(0,0,W,H);
    shapes.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;s.rot+=s.vrot;
      if(s.y<-60){s.y=H+40;s.x=rnd(0,W)}
      if(s.x<-60)s.x=W+40;if(s.x>W+60)s.x=-40;
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
      if(s.t==='star')drawStar(ctx,0,0,s.size,s.color,s.op);
      else if(s.t==='heart')drawHeart(ctx,0,0,s.size*.7,s.color,s.op);
      else if(s.t==='flower')drawFlower(ctx,0,0,s.size*.8,s.color,s.op);
      else if(s.t==='abc')drawABC(ctx,0,0,s.size*.7,s.color,s.op);
      else{ctx.globalAlpha=s.op;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,s.size*.6,0,Math.PI*2);ctx.fill()}
      ctx.restore();
    });
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>

<script>
function showErr(m){const el=document.getElementById('msg-err');el.textContent=m;el.style.display='block';document.getElementById('msg-ok').style.display='none'}
function showOk(m){const el=document.getElementById('msg-ok');el.textContent=m;el.style.display='block';document.getElementById('msg-err').style.display='none'}
function clearMsgs(){document.getElementById('msg-err').style.display='none';document.getElementById('msg-ok').style.display='none'}

function showNameForm(){
  document.getElementById('form-name').style.display='block';
  document.getElementById('form-pin').style.display='none';
  document.getElementById('form-welcome').style.display='none';
  clearMsgs();
}
function backToPhone(){ showNameForm(); }
function showWelcomeForm(name){
  document.getElementById('welcome-name-text').textContent='Xush kelibsiz, '+name+'!';
  document.getElementById('form-name').style.display='none';
  document.getElementById('form-pin').style.display='none';
  document.getElementById('form-welcome').style.display='block';
}

// Telefon raqamni faqat raqamlarga tozalaydi (masalan +998901234567 -> 998901234567)
function normalizePhone(raw){
  return raw.replace(/\D/g,'');
}
</script>

<!-- CAPTCHA (Cloudflare Turnstile) — bepul bot himoyasi -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<script>
const NAME_KEY='mgh_saved_name';
const PHONE_KEY='mgh_saved_phone';

/* ═══════════════════════════════════════════════════════════════
   CAPTCHA sozlamasi (BEPUL — Cloudflare Turnstile).
   1) Cloudflare → Turnstile → Add site → Site key va Secret key oling.
   2) Site key'ni pastga qo'ying.
   3) Supabase → Authentication → Settings → Bot & Abuse Protection →
      Turnstile'ni yoqib, Secret key'ni kiriting.
   Kalit bo'sh bo'lsa — CAPTCHA o'chiq, login avvalgidek ishlaydi (buzilmaydi).
   ═══════════════════════════════════════════════════════════════ */
const TURNSTILE_SITE_KEY = '0x4AAAAAAEK_hTmpT707hm_Z';   // ← Cloudflare Site key'ni shu yerga qo'ying

let _tsWidgetId=null, _tsToken=null, _tsWaiters=[];
function captchaEnabled(){ return !!TURNSTILE_SITE_KEY && typeof turnstile!=='undefined'; }
function onTsToken(token){ _tsToken=token; _tsWaiters.forEach(function(r){r(token);}); _tsWaiters=[]; }
function renderCaptcha(){
  if(!captchaEnabled()) return;
  if(_tsWidgetId!==null) return;  // allaqachon render qilingan
  try{
    _tsWidgetId = turnstile.render('#cf-container', {
      sitekey: TURNSTILE_SITE_KEY,
      callback: onTsToken,
      'error-callback': function(){ _tsToken=null; },
      'expired-callback': function(){ _tsToken=null; }
    });
  }catch(e){ /* qayta render bo'lsa e'tiborsiz */ }
}
function _awaitToken(){
  return new Promise(function(resolve){
    var to=setTimeout(function(){resolve(undefined);}, 8000);
    _tsWaiters.push(function(tok){ clearTimeout(to); resolve(tok); });
  });
}
// Har auth so'rovi uchun BITTA yangi token (token bir marta ishlatiladi)
async function nextCaptchaToken(){
  if(!captchaEnabled()) return undefined;
  if(_tsToken){ var t=_tsToken; _tsToken=null; return t; }
  return await _awaitToken();
}
async function freshCaptchaToken(){
  if(!captchaEnabled()) return undefined;
  _tsToken=null;
  try{ if(_tsWidgetId!==null) turnstile.reset(_tsWidgetId); }catch(e){}
  return await _awaitToken();
}

window.addEventListener('load',async()=>{
  const{data:{session}}=await _sb.auth.getSession();
  const savedName=localStorage.getItem(NAME_KEY);
  const savedPhone=localStorage.getItem(PHONE_KEY);

  if(session && savedName && savedPhone){
    // Sessiya hali faol shu qurilmada — to'g'ridan-to'g'ri dashboardga
    window.location.href='dashboard.html';
    return;
  }
  if(savedName && savedPhone){
    showWelcomeForm(savedName);
  }
});

// ═══════ PIN bilan kirish ═══════
var AUTH = { name:'', digits:'', mode:'' };  // mode: login | migrate | register

function synthEmail(d){ return d + '@phone.maktabgachahub.uz'; }
function legacyPass(d){ return 'mgh_' + d + '_pass'; }

async function continueSession(){
  const name=localStorage.getItem(NAME_KEY);
  const phone=localStorage.getItem(PHONE_KEY);
  if(!name||!phone){ showNameForm(); return; }
  await proceedPhone(name, phone);
}

async function doNameLogin(){
  const name=document.getElementById('name-input').value.trim();
  const phoneRaw=document.getElementById('phone-input').value.trim();
  const phone=normalizePhone(phoneRaw);
  if(!name||name.length<2){ showErr("Iltimos, ismingizni to'liq kiriting!"); return; }
  if(!phone||phone.length<9){ showErr("Iltimos, to'g'ri telefon raqam kiriting!"); return; }
  await proceedPhone(name, phone);
}

// 1-bosqich: telefon holatini aniqlab, PIN bosqichiga o'tamiz
async function proceedPhone(name, phoneRaw){
  const btn=document.getElementById('name-btn')||document.getElementById('continue-btn');
  const old=btn?btn.textContent:'';
  if(btn){ btn.textContent='Tekshirilmoqda…'; btn.disabled=true; }
  clearMsgs();

  const digits=normalizePhone(phoneRaw);
  AUTH.name=name; AUTH.digits=digits;

  // Hisob bor-yo'qligini va PIN o'rnatilganini so'raymiz
  let exists=false, hasPin=false;
  try{
    const {data,error}=await _sb.rpc('phone_status',{p_phone:digits});
    if(!error && data && data.length){ exists=data[0].user_exists; hasPin=data[0].has_pin; }
  }catch(e){ console.warn('phone_status:',e); }

  if(btn){ btn.textContent=old; btn.disabled=false; }

  var t=document.getElementById('pin-title');
  var s=document.getElementById('pin-sub');
  var forgot=document.getElementById('pin-forgot');
  if(exists && hasPin){
    AUTH.mode='login';
    t.textContent='PIN kodingizni kiriting';
    s.textContent='Hisobingizga kirish uchun maxfiy PIN kodni kiriting.';
    forgot.style.display='block';
  }else if(exists && !hasPin){
    AUTH.mode='migrate';
    t.textContent='Hisobingizni himoyalang';
    s.textContent='Endilikda kirish uchun maxfiy PIN kod kerak. Yangi PIN o\'ylab toping (4-6 raqam).';
    forgot.style.display='none';
  }else{
    AUTH.mode='register';
    t.textContent='Yangi PIN kod o\'rnating';
    s.textContent='Hisobingizni himoyalash uchun 4-6 raqamli PIN o\'ylab toping. Buni eslab qoling!';
    forgot.style.display='none';
  }

  document.getElementById('form-name').style.display='none';
  document.getElementById('form-welcome').style.display='none';
  document.getElementById('form-pin').style.display='block';
  renderCaptcha();
  var pin=document.getElementById('pin-input'); pin.value=''; pin.focus();
}

// 2-bosqich: PIN yuborish
async function submitPin(){
  const pin=(document.getElementById('pin-input').value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){ showErr('PIN 4-6 raqamdan iborat bo\'lishi kerak.'); return; }

  const btn=document.getElementById('pin-btn');
  const old=btn.textContent; btn.textContent='Kirilmoqda…'; btn.disabled=true;
  clearMsgs();

  const email=synthEmail(AUTH.digits);
  try{
    let session=null;

    if(AUTH.mode==='login'){
      const cap=await nextCaptchaToken();
      const {data,error}=await _sb.auth.signInWithPassword({email,password:pin,options:{captchaToken:cap}});
      if(error||!data.session){ resetCaptcha(); showErr('PIN noto\'g\'ri. Qayta urinib ko\'ring.'); btn.textContent=old; btn.disabled=false; return; }
      session=data.session;

    }else if(AUTH.mode==='migrate'){
      // Eski hisob: eski (raqamli) parol bilan kiramiz, so'ng PIN o'rnatamiz
      const cap=await nextCaptchaToken();
      let {data,error}=await _sb.auth.signInWithPassword({email,password:legacyPass(AUTH.digits),options:{captchaToken:cap}});
      if(error||!data.session){
        // Ehtimol allaqachon PIN bor — PIN bilan sinaymiz
        const cap2=await freshCaptchaToken();
        const r=await _sb.auth.signInWithPassword({email,password:pin,options:{captchaToken:cap2}});
        if(r.error||!r.data.session){ resetCaptcha(); showErr('Kirib bo\'lmadi. PIN noto\'g\'ri bo\'lishi mumkin.'); btn.textContent=old; btn.disabled=false; return; }
        session=r.data.session;
      }else{
        session=data.session;
        // PIN'ni yangi parol qilib o'rnatamiz
        const up=await _sb.auth.updateUser({password:pin});
        if(up.error){ console.warn('PIN o\'rnatish:',up.error.message); }
      }
      try{ await _sb.rpc('mark_has_pin'); }catch(e){}

    }else{ // register
      const cap=await nextCaptchaToken();
      const {data,error}=await _sb.auth.signUp({email,password:pin,options:{data:{full_name:AUTH.name},captchaToken:cap}});
      if(error){
        // Hisob allaqachon bor bo'lsa — login/migrate yo'liga o'tamiz
        if((error.message||'').toLowerCase().includes('already')){
          const cap2=await freshCaptchaToken();
          const r=await _sb.auth.signInWithPassword({email,password:pin,options:{captchaToken:cap2}});
          if(r.error||!r.data.session){ resetCaptcha(); showErr('Bu raqam ro\'yxatdan o\'tgan. PIN noto\'g\'ri.'); btn.textContent=old; btn.disabled=false; return; }
          session=r.data.session;
        }else{
          resetCaptcha(); showErr('Ro\'yxatdan o\'tishda xatolik: '+error.message); btn.textContent=old; btn.disabled=false; return;
        }
      }else if(!data.session){
        showErr("Tasdiqlash kerak. Administrator Email confirmation'ni o'chirishi lozim."); btn.textContent=old; btn.disabled=false; return;
      }else{
        session=data.session;
      }
      try{ await _sb.rpc('mark_has_pin'); }catch(e){}
    }

    if(!session){ resetCaptcha(); showErr('Kutilmagan xatolik. Qayta urinib ko\'ring.'); btn.textContent=old; btn.disabled=false; return; }

    // Profil: mavjudning role/tier'iga tegmaymiz. Ism/telefonni yangilaymiz; yangi bo'lsa yaratamiz.
    const {data:existing}=await _sb.from('profiles').select('id').eq('id',session.user.id).maybeSingle();
    if(existing){
      await _sb.from('profiles').update({full_name:AUTH.name,phone:AUTH.digits}).eq('id',session.user.id);
    }else{
      await _sb.from('profiles').insert({id:session.user.id,full_name:AUTH.name,phone:AUTH.digits,xp:0});
      try{ await _sb.rpc('mark_has_pin'); }catch(e){}
    }

    localStorage.setItem(NAME_KEY,AUTH.name);
    localStorage.setItem(PHONE_KEY,AUTH.digits);
    window.location.href='dashboard.html';
  }catch(e){
    resetCaptcha();
    showErr("Kutilmagan xatolik yuz berdi. Qayta urinib ko'ring.");
    btn.textContent=old; btn.disabled=false;
  }
}

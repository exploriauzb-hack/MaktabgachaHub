<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MaktabgachaHub — Testlar</title>
</head>
<body>
<p id="ld" style="font-family:sans-serif;padding:24px;color:#6b7694">Yuklanmoqda…</p>
<script>
/* Bu fayl eski sahifani (test-eski.html) yuklab, unga test-fix.js ni ulaydi. */
(async function(){
  try{
    var r = await fetch('test-eski.html', {cache:'no-store'});
    if(!r.ok) throw new Error('test-eski.html topilmadi (' + r.status + ')');
    var html = await r.text();
    if(!/<\/body>/i.test(html)) throw new Error('test-eski.html noto\'g\'ri fayl');
    html = html.replace(/<\/body>/i, function(){ return '<script src="../js/test-fix.js?v=2"><\/script></body>'; });
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('ld').textContent = 'Xatolik: ' + e.message;
  }
})();
</script>
</body>
</html>
